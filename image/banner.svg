<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Felipe Corredor — Full-Stack &amp; Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#0D1520"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9BEFFF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
      .rot { opacity: 0; animation: rot 12s infinite; }
      .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
      @keyframes rot { 0%{opacity:0} 3%{opacity:1} 22%{opacity:1} 25%{opacity:0} 100%{opacity:0} }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glowA)"/>
    <rect width="1200" height="380" fill="url(#glowB)"/>
    <rect x="0" y="376" width="1200" height="4" fill="url(#line)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- ── Izquierda: identidad ── -->
  <g transform="translate(72,0)">
    <g transform="translate(0,78)">
      <rect width="196" height="30" rx="15" fill="#00F5FF" fill-opacity="0.08" stroke="#00F5FF" stroke-opacity="0.35"/>
      <circle cx="18" cy="15" r="4" fill="#3FB950" class="pulse"/>
      <text x="32" y="20" class="mono" font-size="13" fill="#9BEFFF">disponible para crear</text>
    </g>

    <text x="0" y="172" class="sans" font-size="64" font-weight="700" fill="url(#nameGrad)" letter-spacing="-1.5">Felipe Corredor</text>
    <text x="2" y="212" class="sans" font-size="24" font-weight="500" fill="#C9D1D9">Full-Stack <tspan fill="#00F5FF">&amp;</tspan> Backend Developer</text>

    <g class="mono" font-size="17" fill="#8B949E">
      <text x="2" y="256"><tspan fill="#00F5FF">›</tspan> <tspan class="rot">Clean Architecture con C# / .NET</tspan></text>
      <text x="2" y="256"><tspan fill="#00F5FF" opacity="0">›</tspan> <tspan class="rot r2">APIs RESTful escalables y seguras</tspan></text>
      <text x="2" y="256"><tspan fill="#00F5FF" opacity="0">›</tspan> <tspan class="rot r3">Interfaces modernas con React y Vue</tspan></text>
      <text x="2" y="256"><tspan fill="#00F5FF" opacity="0">›</tspan> <tspan class="rot r4">Agentes de IA y automatizaciones con n8n</tspan></text>
    </g>

    <g class="mono" font-size="13" font-weight="600" transform="translate(2,290)">
      <rect x="0"   width="58"  height="30" rx="8" fill="#239120" fill-opacity="0.18" stroke="#239120" stroke-opacity="0.6"/>
      <text x="29"  y="20" text-anchor="middle" fill="#7EE787">C#</text>
      <rect x="68"  width="70"  height="30" rx="8" fill="#512BD4" fill-opacity="0.22" stroke="#8B6CFF" stroke-opacity="0.6"/>
      <text x="103" y="20" text-anchor="middle" fill="#C4B5FD">.NET</text>
      <rect x="148" width="78"  height="30" rx="8" fill="#61DAFB" fill-opacity="0.12" stroke="#61DAFB" stroke-opacity="0.5"/>
      <text x="187" y="20" text-anchor="middle" fill="#61DAFB">React</text>
      <rect x="236" width="128" height="30" rx="8" fill="#336791" fill-opacity="0.25" stroke="#5B9BD5" stroke-opacity="0.6"/>
      <text x="300" y="20" text-anchor="middle" fill="#9CC9F0">PostgreSQL</text>
      <rect x="374" width="58"  height="30" rx="8" fill="#EA4B71" fill-opacity="0.15" stroke="#EA4B71" stroke-opacity="0.6"/>
      <text x="403" y="20" text-anchor="middle" fill="#FF8FAB">n8n</text>
    </g>
  </g>

  <!-- ── Derecha: terminal ── -->
  <g transform="translate(690,72)">
    <rect width="440" height="236" rx="14" fill="#010409" fill-opacity="0.85" stroke="#30363D"/>
    <path d="M0 14a14 14 0 0 1 14-14h412a14 14 0 0 1 14 14v22H0z" fill="#161B22"/>
    <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="18" r="6" fill="#28C840"/>
    <text x="220" y="23" text-anchor="middle" class="mono" font-size="12" fill="#6E7681">~/corredor29 — zsh</text>

    <g class="mono" font-size="14">
      <text x="20" y="70"><tspan fill="#3FB950">➜</tspan> <tspan fill="#00F5FF">~</tspan> <tspan fill="#E6EDF3">whoami</tspan></text>
      <text x="20" y="94" fill="#8B949E">felipe-corredor · Colombia 🇨🇴</text>

      <text x="20" y="128"><tspan fill="#3FB950">➜</tspan> <tspan fill="#00F5FF">~</tspan> <tspan fill="#E6EDF3">cat focus.json</tspan></text>
      <text x="20" y="152"><tspan fill="#8B949E">{ </tspan><tspan fill="#79C0FF">"backend"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">".NET"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#79C0FF">"front"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"React"</tspan><tspan fill="#8B949E">,</tspan></text>
      <text x="20" y="174"><tspan fill="#8B949E">  </tspan><tspan fill="#79C0FF">"ai"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"n8n"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#79C0FF">"mode"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"clean code"</tspan><tspan fill="#8B949E"> }</tspan></text>

      <text x="20" y="208"><tspan fill="#3FB950">➜</tspan> <tspan fill="#00F5FF">~</tspan> <tspan fill="#00F5FF" class="cursor">▋</tspan></text>
    </g>
  </g>
</svg>
